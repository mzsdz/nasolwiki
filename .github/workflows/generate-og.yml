name: Generate OG image
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Korean font
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf' -o ~/.local/share/fonts/NotoSansKR.ttf
          fc-cache -f
      - name: Render social preview image (1200 x 630)
        run: |
          if command -v rsvg-convert >/dev/null; then
            rsvg-convert -w 1200 -h 630 -o og.png og.svg
          elif command -v magick >/dev/null; then
            magick -background none og.svg -resize 1200x630 og.png
          elif command -v convert >/dev/null; then
            convert -background none og.svg -resize 1200x630 og.png
          else
            python -m pip install --user cairosvg
            python -c "import cairosvg; cairosvg.svg2png(url='og.svg',write_to='og.png',output_width=1200,output_height=630)"
          fi
          file og.png
      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og.png
          if ! git diff --cached --quiet; then
            git commit -m "Build OG preview PNG from SVG"
            git pull --rebase origin main
            git push origin main
          fi
